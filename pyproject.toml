[project]
name = "half-sheet-label"
version = "0.1.0"
description = "Re-impose an already-rendered label PDF onto Avery 8126/5126 half-sheet (5.5x8.5, 2-up) stock at 100% actual size (barcode-safe) and print it. Always uses the top half; flip the sheet to reuse the other label."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "John Randall", email = "john@johnrandall.com" }]
dependencies = [
  "pypdf>=4.2",
]

[project.scripts]
half-sheet-label = "half_sheet_label.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/half_sheet_label"]

# Pure-Python: imposition is pypdf only, no external binaries. Printing/preview
# use macOS `lp` / `open`, which are always present.

# half-sheet-label configuration.
# Copy to $XDG_CONFIG_HOME/half-sheet-label/config.toml (i.e. ~/.config/half-sheet-label/config.toml).
# Every section is optional; the tool works with no config file at all.

[printer]
name = "Athena"           # default CUPS printer
# Where the half-sheet LABEL (sticker) stock feeds from. By design that's
# Tray 2; Tray 1 holds regular paper for normal printing. Until an optional
# Tray 2 cassette is installed and the Brother driver exposes "tray-2", the CLI
# automatically falls back to the hand-fed bypass slot with a warning — so this
# already-correct default works today and needs no change once Tray 2 is in.
label_slot = "tray-2"
